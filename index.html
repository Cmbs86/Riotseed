<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logos/riot-seed-color.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Sedgwick+Ave&family=Shantell+Sans:ital,wght,BNCE@0,300..800,-100..100;1,300..800,-100..100&display=swap"
      rel="stylesheet"
    />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags (homepage defaults — overridden by Helmet on dynamic pages) -->
    <title>Music Marketing for DIY &amp; Independent Bands | Riotseed</title>
    <meta
      name="description"
      content="Berlin-based music marketing agency for punk, alternative &amp; underground bands. Social media, PR, playlists, ads, SEO, websites &amp; EPKs. Germany &amp; France."
    />
    <link rel="canonical" href="https://riotseed.com" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://riotseed.com" />
    <meta
      property="og:title"
      content="Riotseed — Music Marketing for DIY &amp; Independent Bands"
    />
    <meta
      property="og:description"
      content="Berlin-based music marketing for punk, alternative &amp; underground bands. Real impact. No bullshit."
    />
    <meta
      property="og:image"
      content="https://riotseed.com/images/riotseed-banner-new-smaller.webp"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Riotseed — Music Marketing for DIY &amp; Independent Bands"
    />
    <meta
      name="twitter:description"
      content="Berlin-based music marketing for punk, alternative &amp; underground bands. Real impact. No bullshit."
    />
    <meta
      name="twitter:image"
      content="https://riotseed.com/images/riotseed-banner-new-smaller.webp"
    />

    <!-- Schema Markup: ProfessionalService + Founder -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Riotseed",
        "description": "Music digital marketing agency for DIY and independent bands in the punk, alternative, underground, and riot grrrl scenes",
        "url": "https://riotseed.com",
        "logo": "https://riotseed.com/logos/riot-seed-color.svg",
      "image": "https://riotseed.com/images/riotseed-banner-new-smaller.webp",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Berlin",
          "addressCountry": "DE"
        },
        "areaServed": [
          { "@type": "Country", "name": "Germany" },
          { "@type": "Country", "name": "France" }
        ],
        "serviceType": [
          "Music Marketing",
          "SEO",
          "Generative Engine Optimization",
          "Social Media Marketing",
          "Paid Advertising",
          "Music PR",
          "Playlist Pitching",
          "Website Design",
          "EPK Design"
        ],
        "slogan": "Plant the seed. Watch it riot.",
        "knowsAbout": [
          "punk music",
          "alternative rock",
          "underground music",
          "riot grrrl",
          "DIY music scene",
          "independent music"
        ],
        "founder": {
          "@type": "Person",
          "name": "Aude Leteurtre",
          "jobTitle": "Founder",
          "description": "Music digital marketing professional with 12+ years in the music industry. Former Spotify Account & Campaign Manager. Active punk musician. Based in Berlin.",
          "knowsAbout": [
            "music marketing",
            "SEO",
            "digital advertising",
            "Spotify",
            "social media marketing",
            "punk music",
            "DIY music scene"
          ],
          "worksFor": {
            "@type": "Organization",
            "name": "Riotseed"
          },
          "alumniOf": [
            { "@type": "Organization", "name": "Spotify" },
            { "@type": "Organization", "name": "Vice Media" },
            { "@type": "Organization", "name": "Viacom" },
            { "@type": "Organization", "name": "OUI FM" },
            { "@type": "Organization", "name": "SideOneDummy Records" },
            { "@type": "Organization", "name": "People Like You Records" }
          ]
        },
        "sameAs": [
          "https://www.instagram.com/riotseed",
          "https://www.facebook.com/riotseed",
          "https://www.linkedin.com/company/riotseed/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
