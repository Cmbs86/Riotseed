<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logos/riot-seed-color.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Sedgwick+Ave&family=Shantell+Sans:ital,wght,BNCE@0,300..800,-100..100;1,300..800,-100..100&display=swap"
      rel="stylesheet"
    />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      NOTE: title, meta description, canonical, robots, and OG/Twitter tags are
      intentionally NOT hardcoded here anymore. react-helmet-async only manages
      tags that it itself renders — it has no way to see or remove tags that are
      already sitting in this static index.html, so having them here as well as
      in each page's <Helmet> caused every route to ship TWO <title> tags and TWO
      canonical tags at once (one static, pointing to the homepage; one correct,
      from Helmet). Google flagged this as "Alternative page with proper canonical
      tag" since it couldn't tell which canonical to trust.
      Every route (including the homepage, via Home.tsx) now sets its own
      complete set of these tags through <Helmet>, so there is exactly one of
      each on every page.
    -->

    <!-- Schema 1: ProfessionalService + Founder -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Riotseed",
        "description": "Music digital marketing agency for DIY and independent bands in the punk, alternative, underground, and riot grrrl scenes",
        "url": "https://riotseed.com",
        "logo": "https://riotseed.com/logos/riot-seed-color.svg",
        "image": "https://riotseed.com/images/riotseed-banner-new-smaller.webp",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Berlin",
          "addressCountry": "DE"
        },
        "areaServed": [
          { "@type": "Country", "name": "Germany" },
          { "@type": "Country", "name": "France" }
        ],
        "serviceType": [
          "Music Marketing",
          "SEO",
          "Generative Engine Optimization",
          "Social Media Marketing",
          "Paid Advertising",
          "Music PR",
          "Playlist Pitching",
          "Website Design",
          "EPK Design"
        ],
        "slogan": "Plant the seed. Watch it riot.",
        "knowsAbout": [
          "punk music",
          "alternative rock",
          "underground music",
          "riot grrrl",
          "DIY music scene",
          "independent music"
        ],
        "founder": {
          "@type": "Person",
          "name": "Aude Leteurtre",
          "jobTitle": "Founder",
          "description": "Music digital marketing professional with 12+ years in the music industry. Former Spotify Account & Campaign Manager. Active punk musician. Based in Berlin.",
          "knowsAbout": [
            "music marketing",
            "SEO",
            "digital advertising",
            "Spotify",
            "social media marketing",
            "punk music",
            "DIY music scene"
          ],
          "worksFor": {
            "@type": "Organization",
            "name": "Riotseed"
          },
          "alumniOf": [
            { "@type": "Organization", "name": "Spotify" },
            { "@type": "Organization", "name": "Vice Media" },
            { "@type": "Organization", "name": "Viacom" },
            { "@type": "Organization", "name": "OUI FM" },
            { "@type": "Organization", "name": "SideOneDummy Records" },
            { "@type": "Organization", "name": "People Like You Records" }
          ]
        },
        "sameAs": [
          "https://www.instagram.com/riotseed",
          "https://www.facebook.com/riotseed",
          "https://www.linkedin.com/company/riotseed/",
          "https://www.tiktok.com/@riotseed",
          "https://open.spotify.com/user/1120329740?si=b969c93a2875443c"
        ]
      }
    </script>

    <!-- Schema 2: CollectionPage — Projects portfolio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Riotseed Projects",
        "description": "Music marketing case studies and portfolio featuring DIY and independent bands and brands",
        "url": "https://riotseed.com/projects",
        "isPartOf": {
          "@type": "WebSite",
          "name": "Riotseed",
          "url": "https://riotseed.com"
        },
        "mainEntity": [
          {
            "@type": "CreativeWork",
            "name": "Vespa — Social Media & Paid Media Campaign",
            "description": "Full digital presence audit and optimization for Polish ska band Vespa, including social media, SEO, paid media, and content strategy",
            "about": {
              "@type": "MusicGroup",
              "name": "Vespa",
              "genre": "Ska",
              "location": "Szczecin, Poland"
            }
          },
          {
            "@type": "CreativeWork",
            "name": "Veegreen — SEO & Content Marketing",
            "description": "6-month SEO strategy for French wellness brand Veegreen, resulting in +79% organic traffic and +57% Top 10 keyword rankings",
            "about": {
              "@type": "Organization",
              "name": "Veegreen",
              "url": "https://www.veegreen.fr"
            }
          },
          {
            "@type": "CreativeWork",
            "name": "Sick Saints — EU Localisation & PR",
            "description": "DE/FR market entry strategy for Polish brutal glam band Sick Saints, including scene mapping, PR, and playlist pitching",
            "about": {
              "@type": "MusicGroup",
              "name": "Sick Saints",
              "genre": "Brutal Glam",
              "location": "Kraków, Poland"
            }
          },
          {
            "@type": "CreativeWork",
            "name": "Offbeat Affair — EPK & Launch Strategy",
            "description": "Complete EPK creation, social media optimization, and launch marketing for Berlin-based early reggae band Offbeat Affair",
            "about": {
              "@type": "MusicGroup",
              "name": "Offbeat Affair",
              "genre": "Early Reggae",
              "location": "Berlin, Germany"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
